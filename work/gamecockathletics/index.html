<style>
/* ---------- Fonts (self-hosted Inter and Roboto Mono, SIL OFL / Apache 2.0) ---------- */
@font-face{font-family:"Inter";src:url("fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Roboto Mono";src:url("fonts/roboto-mono-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}

/* ---------- Tokens: pure black and white. Pill = interactive, square = imagery ---------- */
:root{
  --bg:#EEEFED; --bg-2:#E3E5E2; --card:#FBFBFA; --card-line:rgba(12,13,14,.08); --card-shadow:0 2px 4px rgba(30,40,36,.06),0 24px 48px -16px rgba(30,40,36,.22),0 60px 110px -40px rgba(30,40,36,.35); --ink:#0C0D0E; --mute:#585C60; --line:rgba(12,13,14,.16);
  --shadow:rgba(30,40,36,.22);
  --r:24px; --gap:clamp(52px,6vw,92px); --nav-h:64px; --gutter:clamp(16px,3.2vw,48px); --max:1480px;
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0D; --bg-2:#151617; --ink:#EDEEEB; --mute:#9B9FA3; --line:rgba(237,238,235,.16);
    --card:#17181A; --card-line:rgba(237,238,235,.1); --card-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -16px rgba(0,0,0,.7),0 60px 110px -40px rgba(0,0,0,.9);
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0D; --bg-2:#151617; --ink:#EDEEEB; --mute:#9B9FA3; --line:rgba(237,238,235,.16);
  --card:#17181A; --card-line:rgba(237,238,235,.1); --card-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -16px rgba(0,0,0,.7),0 60px 110px -40px rgba(0,0,0,.9);
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--bg)}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;z-index:100}
.skip:focus{left:8px}

/* ---------- Nav (one line, 64px) ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;color:var(--ink);padding:5px;margin:-5px}
.brand svg{display:block;height:34px;width:34px;transition:transform .6s var(--ease)}
.brand:hover svg{transform:scale(1.08)}
.brand:active svg{transform:scale(.96)}
.nav-links{display:flex;align-items:center;gap:clamp(14px,2.4vw,34px);font-size:.92rem;white-space:nowrap}
.nav-links a{position:relative;padding:6px 0;color:var(--mute);transition:color .25s}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--ink)}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.nav-links a:hover::after,.nav-links a[aria-current="page"]::after{transform:scaleX(1)}
.theme{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.theme i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);transition:transform .5s var(--ease)}
.theme:hover i{transform:rotate(180deg)}

/* ---------- Mobile menu: hamburger + right slide-out drawer ---------- */
.menu-btn,.drawer-close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);position:relative;flex:none;transition:background .3s,border-color .3s}
.menu-btn{display:none}
.menu-btn span,.drawer-close span{position:absolute;left:50%;top:50%;width:18px;height:1.5px;margin:-.75px 0 0 -9px;background:var(--ink);transition:transform .6s var(--ease)}
.menu-btn span:nth-child(1){transform:translateY(-3.5px)}
.menu-btn span:nth-child(2){transform:translateY(3.5px)}
.menu-btn:active span:nth-child(1){transform:translateY(-3.5px) scaleX(.7)}
.menu-btn:active span:nth-child(2){transform:translateY(3.5px) scaleX(.7)}
.drawer-close{position:absolute;top:10px;right:var(--gutter);z-index:1}
.drawer-close span:nth-child(1){transform:rotate(45deg)}
.drawer-close span:nth-child(2){transform:rotate(-45deg)}
.drawer-close:hover{background:var(--ink)}
.drawer-close:hover span{background:var(--bg)}
.drawer{position:fixed;inset:0;z-index:90;visibility:hidden;pointer-events:none;transition:visibility 0s .8s}
.drawer.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.drawer-scrim{position:absolute;inset:0;background:rgba(6,7,9,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .7s var(--ease)}
.drawer.open .drawer-scrim{opacity:1}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(88vw,400px);display:flex;flex-direction:column;padding:clamp(88px,14vh,120px) 28px 28px;background:color-mix(in srgb,var(--card) 58%,transparent);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);border-left:1px solid rgba(255,255,255,.2);border-radius:var(--r) 0 0 var(--r);box-shadow:inset 1px 0 0 rgba(255,255,255,.14),-40px 0 90px -30px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .8s cubic-bezier(.16,1,.3,1);overflow-y:auto;overscroll-behavior:contain}
.drawer.open .drawer-panel{transform:none}
.drawer-links{display:grid;gap:4px}
.drawer-links a{display:block;padding:8px 0;font-size:clamp(1.8rem,8.4vw,2.5rem);line-height:1.08;letter-spacing:-.04em;font-weight:600;white-space:nowrap;color:var(--mute);opacity:0;transform:translateX(36px);filter:blur(12px);transition:opacity .35s,transform .35s,filter .35s,color .3s}
.drawer-links a:hover,.drawer-links a[aria-current]{color:var(--ink)}
.drawer.open .drawer-links a,.drawer.open .drawer-foot{opacity:1;transform:none;filter:blur(0);transition:opacity .9s var(--ease),transform 1s var(--ease),filter .9s var(--ease),color .3s;transition-delay:calc(.18s + var(--i) * .08s)}
.drawer-foot{margin-top:auto;padding-top:32px;display:grid;gap:22px;opacity:0;transform:translateX(36px);filter:blur(12px);transition:opacity .35s,transform .35s,filter .35s}
.drawer-mail{display:inline-block;padding-block:10px;font-size:1.15rem;letter-spacing:-.02em;font-weight:500}
.theme-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--line);border-radius:999px;width:100%;max-width:260px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.theme-seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ink);transition:transform .7s var(--ease)}
.theme-seg[data-active="dark"]::before{transform:translateX(100%)}
.theme-seg button{position:relative;z-index:1;padding:11px 0;font-size:.92rem;font-weight:500;color:var(--mute);transition:color .4s}
.theme-seg button[aria-pressed="true"]{color:var(--bg)}
@media (prefers-reduced-transparency:reduce){.drawer-scrim{background:rgba(6,7,9,.75);backdrop-filter:none;-webkit-backdrop-filter:none}.drawer-panel{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.drawer-panel{background:var(--card)}}
@media (min-width:768px){.drawer{display:none}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px;font-weight:500;font-size:.95rem;white-space:nowrap;border:1px solid var(--ink);border-radius:999px;transition:transform .35s var(--ease),background .25s,color .25s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--bg);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn .arr{display:inline-flex;align-items:center;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}

/* ---------- Views ---------- */
main{min-height:100dvh}
.view{padding-top:var(--nav-h)}

/* ---------- Hero: one layered stage (photo underneath, type and buttons on top) ---------- */
.hero{padding-top:clamp(12px,2vw,24px)}
.hero-stage{position:relative;display:flex;align-items:flex-end;isolation:isolate;overflow:hidden;border-radius:var(--r);color:#fff;min-height:clamp(430px,68dvh,720px)}
.hero-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit;background:#3b4a35}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform:scale(1.1)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,10,7,.66) 0%,rgba(6,10,7,.34) 48%,rgba(6,10,7,0) 88%)}
.hero-over{padding:clamp(28px,4.5vw,72px);max-width:min(100%,1100px)}
.hero h1{font-size:clamp(2.6rem,min(7vw,11.5vh),7rem);line-height:.98;letter-spacing:-.05em;font-weight:600;max-width:22ch;text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:500;padding-bottom:.08em}
.hero-over p{margin-top:clamp(18px,3vh,30px);max-width:46ch;color:rgba(255,255,255,.94);font-size:clamp(1rem,1.25vw,1.15rem)}
.hero-cta{margin-top:clamp(22px,4vh,38px);display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.primary{background:#fff;border-color:#fff;color:#0C0D0E}
.hero .btn.primary:hover{background:transparent;color:#fff}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.8);background:rgba(8,12,9,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero .btn.ghost:hover{background:#fff;color:#0C0D0E}
@media (prefers-reduced-transparency:reduce){.hero .btn.ghost{background:rgba(8,12,9,.6);backdrop-filter:none;-webkit-backdrop-filter:none}}

/* ---------- Section heads ---------- */
.sec{padding-block:var(--gap)}
.sec h2{font-size:clamp(2rem,4.4vw,4rem);line-height:1;letter-spacing:-.04em;font-weight:600}
.sec-head{margin-bottom:clamp(36px,6vw,72px)}
.sec-head p{margin-top:16px;max-width:52ch;color:var(--mute)}

/* ---------- Work carousel (native scroll-snap, drag + arrows) ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.sec.work{padding-top:var(--gap)}
.work .sec-head{margin-bottom:clamp(18px,2.4vw,30px)}
.work .sec-head h2{font-size:clamp(1.8rem,3.2vw,2.8rem)}
.car-wrap{timeline-scope:--car}
.car-btns{display:flex;gap:8px}
.car-btn{width:48px;height:48px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:1.1rem;transition:background .25s,color .25s,opacity .25s,transform .3s var(--ease)}
.car-btn:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.car-btn:active:not(:disabled){transform:scale(.96)}
.car-btn:disabled{opacity:.3;cursor:default}
.car{display:flex;gap:clamp(16px,2vw,32px);overflow-x:auto;overflow-y:hidden;padding-bottom:16px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab;
  --pad:max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter)));padding-inline:var(--pad);scroll-padding-inline:var(--pad);scroll-timeline:--car inline}
.car::-webkit-scrollbar{display:none}
.car.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.car.drag a{pointer-events:none}
.card{flex:0 0 clamp(290px,38vw,620px);scroll-snap-align:start;display:block;user-select:none;-webkit-user-select:none}
.card .ph{overflow:hidden;background:var(--bg-2);aspect-ratio:4/3;border-radius:var(--r)}
.card .ph img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;transition:transform 1.2s var(--ease)}
.card:hover .ph img{transform:scale(1.045)}
.card:active .ph{transform:scale(.995)}
.card .cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:18px}
.card h3{font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.card .cap span{color:var(--mute);font-size:.92rem;white-space:nowrap}
.car-bar{display:none;height:2px;background:var(--line);margin-top:clamp(28px,4vw,44px)}
.car-bar i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(.2)}
@supports (animation-timeline:scroll()){
  .car-bar{display:block}
  .car-bar i{animation:bar linear both;animation-timeline:--car}
}
@keyframes bar{from{transform:scaleX(.18)}to{transform:scaleX(1)}}

/* ---------- Clients: single-color marks (alpha-masked, so they follow the theme) ---------- */
.clients{--cg:clamp(16px,3vw,44px);display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(28px,4vw,56px) var(--cg);margin-top:clamp(40px,6vw,80px)}
.logo{flex:0 0 calc((100% - (var(--cols,5) - 1) * var(--cg)) / var(--cols,5));display:grid;place-items:center;height:72px;color:var(--mute)}
.logo span{display:block;width:min(var(--w,130px),100%);height:var(--h,42px);background:currentColor;-webkit-mask:var(--s) center / var(--ms,contain) no-repeat;mask:var(--s) center / var(--ms,contain) no-repeat}

/* ---------- Footer + site map ---------- */
.foot{border-top:1px solid var(--line);padding-block:var(--gap) 32px}
.foot-mail{display:block;padding-block:10px;margin-block:-10px;font-size:clamp(1.6rem,4.2vw,4rem);line-height:1;letter-spacing:-.05em;font-weight:600;word-break:break-word;transition:opacity .3s}
.foot-mail:hover{opacity:.55}
.foot-row{margin-top:clamp(28px,5vw,56px);display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center}
.foot-row .tel{color:var(--mute);transition:color .25s}
.foot-row .tel:hover{color:var(--ink)}
.sitemap{margin-top:clamp(56px,9vw,128px);padding-top:clamp(32px,5vw,56px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(12,1fr);gap:40px 24px}
.sm-col:nth-child(1){grid-column:1 / span 3}
.sm-col:nth-child(2){grid-column:5 / -1}
.sm-col h2{font-size:.9rem;font-weight:500;color:var(--mute);margin-bottom:16px}
.sm-col ul{list-style:none;display:grid;gap:9px}
.sm-col.two ul{display:block;columns:2;column-gap:32px}
.sm-col.two li{break-inside:avoid;margin-bottom:9px}
.sm-col a,.foot-row .tel,.back{display:inline-flex;align-items:center;min-height:28px}
.sm-col a{transition:opacity .25s}
.sm-col a:hover{opacity:.55}
.soc{list-style:none;display:flex;gap:10px;flex-wrap:wrap}
.soc a{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .3s,color .3s,border-color .3s,transform .35s var(--ease)}
.soc a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.soc a:active{transform:scale(.94)}
.soc i{display:block;width:20px;height:20px;background:currentColor;-webkit-mask:var(--s) center / contain no-repeat;mask:var(--s) center / contain no-repeat}
.legal{margin-top:clamp(48px,8vw,96px);color:var(--mute);font-size:.85rem}

/* ---------- Project page ---------- */
.p-top{padding-block:clamp(20px,2.6vw,32px) clamp(10px,1.4vw,16px)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:.92rem;margin-bottom:clamp(8px,1.2vw,14px);transition:color .25s}
.back:hover{color:var(--ink)}
.p-top h1{font-size:clamp(2rem,4.6vw,4.4rem);line-height:1;letter-spacing:-.05em;font-weight:600;max-width:22ch;text-wrap:balance}
.p-banner{margin-top:clamp(16px,2vw,24px)}
.p-banner img{width:100%;height:clamp(220px,46dvh,560px);object-fit:cover;border-radius:var(--r)}
.p-body{display:grid;grid-template-columns:repeat(12,1fr);gap:48px 24px;padding-block:clamp(28px,3.4vw,48px) clamp(40px,7vw,96px)}
.meta{grid-column:8 / -1;grid-row:1;align-self:start;display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.meta dt{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.meta dd{font-size:.98rem}
.p-text{grid-column:1 / span 7;grid-row:1}
.p-text .lede{font-size:clamp(1.5rem,2.7vw,2.4rem);line-height:1.15;letter-spacing:-.03em;font-weight:500;text-wrap:pretty}
.p-text p+p{margin-top:20px;color:var(--mute);max-width:60ch}
.p-text .lede+p{margin-top:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:40px clamp(20px,3vw,48px);padding-block:clamp(16px,3vw,40px) clamp(56px,8vw,112px)}
.stat{position:relative;padding-left:clamp(18px,2vw,28px)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--ink)}
.stat b{display:block;font-family:var(--mono);font-size:clamp(2rem,3.7vw,3.5rem);line-height:1;letter-spacing:-.04em;font-weight:500;white-space:nowrap}
.stat span.l{display:block;margin-top:14px;color:var(--mute);font-size:.95rem;max-width:24ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.frames{display:grid;gap:clamp(20px,3vw,40px);padding-bottom:clamp(56px,9vw,128px)}
.frames img{width:100%;background:var(--bg-2);border-radius:var(--r)}
.frames .in-narrow{width:min(100%,83.5%)}
.frames .r{margin-left:auto}

/* ---------- Lightbox ---------- */
[data-zoom]{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,7,9,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.lb.open{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
@media (prefers-reduced-transparency:reduce){.lb{background:rgb(6,7,9);backdrop-filter:none;-webkit-backdrop-filter:none}}
.lb-stage{width:100%;height:100%;display:flex;overflow:auto;padding:clamp(64px,7vw,88px) clamp(12px,5vw,96px);box-sizing:border-box;cursor:zoom-out;overscroll-behavior:contain}
.lb-img{margin:auto;display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:calc(var(--r) / 2);cursor:default;transform:scale(.97);filter:blur(14px);opacity:0;transition:transform .9s var(--ease),filter .7s var(--ease),opacity .6s var(--ease)}
.lb-img.ready{transform:none;filter:blur(0);opacity:1}
.lb-btn{position:absolute;z-index:1;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:1.25rem;line-height:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,color .25s,transform .3s var(--ease)}
.lb-btn:hover{background:#fff;color:#0C0D0E}
.lb-btn:active{transform:scale(.94)}
.lb-btn:focus-visible{outline-color:#fff}

.play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:transform .45s var(--ease)}
.play::after{content:"";margin-left:5px;border-left:18px solid #0C0D0E;border-top:11px solid transparent;border-bottom:11px solid transparent}
.yt:hover .play{transform:scale(1.1)}
.yt:active .play{transform:scale(.96)}
.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r);background:#000}

.shoot-head{display:flex;align-items:flex-end;justify-content:flex-end;gap:24px;margin-bottom:clamp(18px,2.6vw,30px)}
.shoot-head h2{font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:-.04em;font-weight:600}
.mosaic{--pad:max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter)));display:flex;gap:12px;height:var(--mh);padding-inline:var(--pad);overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab;scroll-timeline:--mos inline}
.mosaic::-webkit-scrollbar{display:none}
.mosaic.drag{cursor:grabbing;scroll-behavior:auto}
.mosaic.drag img{pointer-events:none}
.mos-col{flex:none;display:flex;flex-direction:column;gap:12px;height:calc(100% * var(--h,1));align-self:var(--a,stretch);width:calc(var(--mh) * var(--k))}
.mos-col img{width:100%;min-height:0;object-fit:cover;border-radius:calc(var(--r) * .6);background:var(--bg-2);cursor:zoom-in;-webkit-user-drag:none;transition:transform 1.1s var(--ease),opacity .5s var(--ease)}
.mosaic:hover img{opacity:.6}
.mosaic img:hover{opacity:1;transform:scale(1.025)}
.shoot .car-bar i{animation-timeline:--mos}

/* ---------- Previous / next project ---------- */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;border-top:1px solid var(--line);padding-block:clamp(24px,3.4vw,44px)}
.pn a{display:block}
.pn-next{text-align:right}
.pn small{display:block;color:var(--mute);font-size:.88rem;margin-bottom:6px}
.pn b{display:block;font-size:clamp(1.1rem,2.2vw,1.75rem);line-height:1.12;letter-spacing:-.035em;font-weight:600;transition:opacity .3s}

.pn .pa{display:inline-block;transition:transform .45s var(--ease)}
.pn-prev:hover .pa{transform:translateX(-5px)}
.pn-next:hover .pa{transform:translateX(5px)}

.statement-w{max-width:26ch}

.col-b{grid-column:7 / -1;margin-left:clamp(0px,2.4vw,40px);padding:clamp(24px,3.4vw,48px);background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);box-shadow:var(--card-shadow);align-self:start}

.col-a .statement{font-size:clamp(2rem,3.7vw,3.5rem);margin-bottom:clamp(24px,3vw,36px)}

@media (prefers-reduced-motion:no-preference){

  .js .card .cap{opacity:0;transform:translateY(14px);filter:blur(10px);transition:opacity 1s var(--ease) .15s,transform 1s var(--ease) .15s,filter 1s var(--ease) .15s}
  .js .card.in .cap{opacity:1;transform:none;filter:blur(0)}
  .js .rv{opacity:0;transform:translateY(34px);filter:blur(16px);transition:opacity 1.2s var(--ease),transform 1.6s var(--ease),filter 1.2s var(--ease);transition-delay:var(--d,0s)}
  .js .rv.in{opacity:1;transform:none;filter:blur(0)}
  .w{display:inline-block;animation:wordin 1.5s var(--ease) both;animation-delay:calc(.08s + min(calc(var(--i) * 70ms),1000ms))}
  .hero-over p{animation:rise 1.5s var(--ease) .3s both}

  .hero-bg{animation:unmask 1.8s var(--ease) both}
  .about-photo.first{animation:unmask 1.8s var(--ease) .1s both}
  @supports (animation-timeline:scroll()){
    .hero-bg img{animation:depth linear both;animation-timeline:scroll(root);animation-range:0 100vh}
  }
  .js .stat::before{transform:scaleY(0);transform-origin:top;transition:transform 1.6s var(--ease);transition-delay:var(--d,0s)}
  .js .stat.in::before{transform:scaleY(1)}
  .view-in{animation:fadeview .9s var(--ease) both}
}
@keyframes wordin{from{opacity:0;transform:translateY(.4em);filter:blur(14px)}}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(14px)}}
@keyframes unmask{from{opacity:0;clip-path:inset(0 0 100% 0);filter:blur(26px)}}
@keyframes depth{to{transform:scale(1.1) translateY(-4%)}}
@keyframes fadeview{from{opacity:0;transform:translateY(16px);filter:blur(12px)}}

/* The shoot mosaic: a seeded shuffle, then irregular columns (mostly two photos high, split unevenly).
   Same seed gives the same wall every visit. Change MOSAIC_SEED to deal a different one. */
const MOSAIC_SEED = 7;
const seeded = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
function shootMosaic(p){
  const rnd = seeded([...p.slug].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) + MOSAIC_SEED);
  const items = [...p.shoot];
  for (let x = items.length - 1; x > 0; x--){ const y = Math.floor(rnd() * (x + 1)); [items[x], items[y]] = [items[y], items[x]]; }
  const cols = [];
  while (items.length){
    const a = items.shift();
    if (a[2] > a[1]){ cols.push({k:.62 + rnd() * .1, imgs:[[a,1]]}); continue; }                 /* portrait: one tall frame */
    const j = items.findIndex(x => x[2] <= x[1]);
    if (j < 0 || rnd() < .1){ cols.push({k:1 + rnd() * .3, imgs:[[a,1]]}); continue; }              /* now and then a lone wide frame */
    const b = items.splice(j, 1)[0], top = .36 + rnd() * .28;
    cols.push({k:.7 + rnd() * .28, imgs:[[a, top], [b, 1 - top]]});
  }
  /* uneven edges: each column a different height, sitting high, low or centred, never the same as its neighbour */
  const al = ['flex-start','flex-end','center'];
  cols.forEach((col, ix) => {
    col.h = (.78 + rnd() * .22).toFixed(3);
    let a = al[Math.floor(rnd() * 3)]; if (ix && a === cols[ix - 1].a) a = al[(al.indexOf(a) + 1) % 3];
    col.a = a; col.k = col.k.toFixed(3);
  });
  const pad = i => String(i).padStart(2, '0');
  let n = 0, ord = 0;
  return `
  <section class="shoot" aria-label="Photos from the shoot">
    <div class="wrap"><div class="rule"></div></div>
    <div class="wrap shoot-head">
      <div class="car-btns">
        <button class="car-btn" id="mos-prev" type="button" aria-label="Previous photos">&larr;</button>
        <button class="car-btn" id="mos-next" type="button" aria-label="Next photos">&rarr;</button>
      </div>
    </div>
    <div class="mosaic" id="mosaic" role="region" aria-roledescription="carousel" aria-label="Photos from the shoot">${cols.map(col => `
      <div class="mos-col" style="--k:${col.k};--h:${col.h};--a:${col.a}">${col.imgs.map(([[i,w,h], r]) => `<img src="${IMG}${p.dir}/shoot/t${pad(i)}.webp" data-full="${IMG}${p.dir}/shoot/f${pad(i)}.webp" data-zoom data-group="shoot" data-i="${ord++}" tabindex="0" role="button" alt="${esc(p.title)}, shoot photo ${i}" aria-label="View larger: ${esc(p.title)}, shoot photo ${i}" width="${w}" height="${h}" style="flex:${r} 1 0" draggable="false" loading="${n++ < 8 ? 'eager' : 'lazy'}">`).join('')}</div>`).join('')}
    </div>
    <div class="wrap"><div class="car-bar" aria-hidden="true"><i></i></div></div>
  </section>`;
}

/* One wiring for every side-scroller: arrows, edge-aware disabled state, and mouse drag. */
function wireScroller(sc, prev, next, itemSel){
  if (!sc || !prev || !next) return;
  const step = () => Math.max(sc.clientWidth * .7, 300);
  const go = d => sc.scrollBy({left: d * step(), behavior: reduce.matches ? 'auto' : 'smooth'});
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  const items = sc.querySelectorAll(itemSel);
  const edge = new IntersectionObserver(es => es.forEach(e => {
    if (e.target === items[0]) prev.disabled = e.isIntersecting && e.intersectionRatio > .98;
    if (e.target === items[items.length - 1]) next.disabled = e.isIntersecting && e.intersectionRatio > .98;
  }), {root:sc, threshold:[.98,1]});
  edge.observe(items[0]); edge.observe(items[items.length - 1]);
  prev.disabled = true;
  /* pre-load: native lazy loading is too cautious for a side-scroller, so wake columns within about a screen ahead of (and half a screen behind) the view */
  const woke = new WeakSet();
  const near = () => {
    const box = sc.getBoundingClientRect(), L = sc.scrollLeft - sc.clientWidth * .5, R = sc.scrollLeft + sc.clientWidth * 2;
    items.forEach(it => {
      if (woke.has(it)) return;
      const x = it.getBoundingClientRect().left - box.left + sc.scrollLeft;
      if (x + it.offsetWidth > L && x < R){ woke.add(it); it.querySelectorAll('img[loading="lazy"]').forEach(im => { im.loading = 'eager'; }); }
    });
  };
  let raf = 0;
  sc.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(near); }, {passive:true});
  near();
  /* mouse drag to scroll (touch and trackpads already scroll natively) */
  sc.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    let moved = false; const x0 = e.clientX, l0 = sc.scrollLeft;
    const mv = ev => { const dx = ev.clientX - x0; if (!moved && Math.abs(dx) > 6){ moved = true; sc.classList.add('drag'); } if (moved) sc.scrollLeft = l0 - dx; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if (moved) sc.classList.remove('drag'); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}

function splitWords(el){
  if (reduce.matches) return;
  el.setAttribute('aria-label', el.textContent.replace(/\s+/g,' ').trim());
  let i = 0;
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3){
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(t => {
        if (!t) return;
        if (/^\s+$/.test(t)) frag.append(' ');
        else { const w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden','true'); w.style.setProperty('--i', i++); w.textContent = t; frag.append(w); }
      });
      c.replaceWith(frag);
    } else if (c.nodeType === 1) walk(c);
  });
  walk(el);
}

/* Stats: line draws in, numbers count up once when they enter the viewport */
function initStats(){
  const stats = [...main.querySelectorAll('.stat')]; if (!stats.length) return;
  const parse = t => { const m = t.match(/^(\D*)([\d,]*\.?\d+)(.*)$/); if (!m) return null;
    const raw = m[2], dec = (raw.split('.')[1] || '').length;
    return {pre:m[1], suf:m[3], val:parseFloat(raw.replace(/,/g,'')), dec, comma:raw.includes(',')}; };
  const fmt = (p, v) => p.pre + v.toLocaleString('en-US', {minimumFractionDigits:p.dec, maximumFractionDigits:p.dec, useGrouping:p.comma}) + p.suf;
  const count = (el, p, delay) => {
    const dur = 2200, t0 = performance.now() + delay;
    const tick = now => {
      const t = Math.min(Math.max((now - t0) / dur, 0), 1);
      el.textContent = fmt(p, p.val * (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  /* phones show three stats side by side, so large numbers switch to compact notation (4.1M+, 89K+) */
  const compact = matchMedia('(max-width: 767px)').matches;
  const toCompact = p => {
    if (!p || !compact || p.val < 1000) return p;
    const big = p.val >= 1e6, d = Math.round((p.val / (big ? 1e6 : 1e3)) * 10) / 10;
    return {pre:p.pre, suf:(big ? 'M' : 'K') + p.suf, val:d, dec:d % 1 ? 1 : 0, comma:false};
  };
  const items = stats.map((st, i) => { const el = st.querySelector('.num'); return {st, el, p:toCompact(parse(el.dataset.n)), delay:i * 150}; });
  if (reduce.matches || !('IntersectionObserver' in window)){
    items.forEach(it => { if (it.p && compact) it.el.textContent = fmt(it.p, it.p.val); });
    stats.forEach(s => s.classList.add('in')); return;
  }
  items.forEach(it => { if (it.p) it.el.textContent = fmt(it.p, 0); });
  const io2 = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const it = items.find(x => x.st === e.target); io2.unobserve(e.target);
    it.st.classList.add('in');
    if (it.p) count(it.el, it.p, it.delay); else it.el.textContent = it.el.dataset.n;
  }), {threshold:.6});
  stats.forEach(st => io2.observe(st));
}

function observe(){
  /* home cards: the frame is there from the first paint, the content waits until the card is properly in view */
  const cards = [...main.querySelectorAll('.card')];
  if (cards.length){
    if (reduce.matches || !('IntersectionObserver' in window)) cards.forEach(c => c.classList.add('in'));
    else { const cio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); cio.unobserve(e.target); } }), {threshold:.4}); cards.forEach(c => cio.observe(c)); }
  }
  if (io) io.disconnect();
  const els = main.querySelectorAll('.rv');
  if (reduce.matches || !('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px', threshold:.08});
  els.forEach(e => io.observe(e));
}

/* In-site links change the page without a reload; files, new tabs and other sites behave normally. */
document.addEventListener('click', e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href]'); if (!a) return;
  if (a.hasAttribute('data-skip')){ e.preventDefault(); main.focus({preventScroll:true}); main.scrollIntoView(); return; }
  if (a.target === '_blank' || a.hasAttribute('download')) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin || /\.(pdf|jpe?g|png|webp|gif|svg|xml|txt)$/i.test(u.pathname)) return;
  e.preventDefault();
  if (a.dataset.scroll){
    const onHome = segs().length === 0; if (!onHome) go('/');
    setTimeout(() => document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior: reduce.matches ? 'auto' : 'smooth'}), onHome ? 0 : 80);
  } else go(u.pathname + u.search + u.hash);
});

/* YouTube: swap the thumbnail for the real player on click */
main.addEventListener('click', e => {
  const b = e.target.closest('.yt'); if (!b) return;
  const f = document.createElement('iframe');
  f.src = `https://www.youtube.com/embed/${b.dataset.id}?autoplay=1&rel=0`;
  f.title = b.dataset.title;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  b.replaceWith(f);
});

/* ---------- Lightbox: click or tap any project image to see it larger ---------- */
const lb = document.createElement('div');
lb.className = 'lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true'); lb.setAttribute('aria-label','Image viewer');
lb.innerHTML = '<button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button><button class="lb-btn lb-prev" type="button" aria-label="Previous image">&larr;</button><button class="lb-btn lb-next" type="button" aria-label="Next image">&rarr;</button><div class="lb-stage"><img class="lb-img" alt=""></div>';
document.body.append(lb);
const lbImg = lb.querySelector('.lb-img'), lbStage = lb.querySelector('.lb-stage');
let lbList = [], lbIdx = 0, lbFrom = null;

function lbShow(i){
  lbIdx = (i + lbList.length) % lbList.length;
  const src = lbList[lbIdx];
  lbImg.classList.remove('ready');
  const done = () => {
    lbImg.classList.add('ready');
    lbStage.scrollLeft = (lbStage.scrollWidth - lbStage.clientWidth) / 2;   /* phones: start centered, swipe to pan */
    lbStage.scrollTop = 0;
  };
  lbImg.onload = done;
  lbImg.src = src.dataset.full || src.currentSrc || src.src;
  lbImg.alt = src.alt;
  if (lbImg.complete && lbImg.naturalWidth) requestAnimationFrame(done);
}
function lbOpen(img){
  const g = img.dataset.group;
  lbList = [...main.querySelectorAll('img[data-zoom]')].filter(x => !g || x.dataset.group === g).sort((a, b) => (+a.dataset.i || 0) - (+b.dataset.i || 0));
  lbFrom = img;
  lb.querySelector('.lb-prev').hidden = lb.querySelector('.lb-next').hidden = lbList.length < 2;
  lb.classList.add('open');
  document.documentElement.style.overflow = 'hidden';
  lbShow(lbList.indexOf(img));
  lb.querySelector('.lb-close').focus({preventScroll:true});
}
function lbClose(){
  if (!lb.classList.contains('open')) return;
  lb.classList.remove('open'); lbImg.classList.remove('ready');
  document.documentElement.style.overflow = '';
  if (lbFrom) lbFrom.focus({preventScroll:true});
}
main.addEventListener('click', e => { const im = e.target.closest('img[data-zoom]'); if (im) lbOpen(im); });
main.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('img[data-zoom]')){ e.preventDefault(); lbOpen(e.target); } });
lb.querySelector('.lb-close').onclick = lbClose;
lb.querySelector('.lb-prev').onclick = () => lbShow(lbIdx - 1);
lb.querySelector('.lb-next').onclick = () => lbShow(lbIdx + 1);
lbStage.addEventListener('click', e => { if (e.target === lbStage) lbClose(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1);
  else if (e.key === 'ArrowRight') lbShow(lbIdx + 1);
  else if (e.key === 'Tab'){   /* keep focus inside the dialog */
    const f = [...lb.querySelectorAll('button:not([hidden])')], first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- Theme (follows the system until the user chooses; nav toggle and menu switch share this) ---------- */
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const seg = document.getElementById('theme-seg');
function syncSeg(){
  const d = isDark();
  seg.dataset.active = d ? 'dark' : 'light';
  seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.mode === 'dark') === d)));
}
function setTheme(t){
  root.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch(_){}
  syncSeg();
}
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch(_){}
syncSeg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncSeg);
document.getElementById('theme').addEventListener('click', () => setTheme(isDark() ? 'light' : 'dark'));
seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.mode)));
</script>
